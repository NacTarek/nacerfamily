<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معاينة: عرض الهاتف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Alexandria,Tahoma,sans-serif;background:#f4f6fb;color:#1b2a4a;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e8f2;padding:10px 12px 8px}
.top h1{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}.top h1 small{font-weight:500;color:#8a97b3;font-size:11px;background:#fff4d6;border-radius:6px;padding:2px 6px}
.srch{position:relative}.srch input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #d5ddec;border-radius:12px;background:#f8f9fc}
#res{position:absolute;inset:auto 0 auto 0;top:46px;background:#fff;border:1px solid #d5ddec;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:60vh;overflow:auto;display:none}
#res div{padding:10px 12px;border-bottom:1px solid #eef1f7}#res small{display:block;color:#8a97b3;font-size:12px}
.crumbs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}.crumbs::-webkit-scrollbar{display:none}
.crumbs button{flex:none;border:0;background:#eef2fa;color:#3b4a6b;border-radius:999px;padding:5px 10px;font-size:12.5px}.crumbs span{color:#b5bfd3;align-self:center;font-size:11px}
main{padding:12px 12px 90px;max-width:560px;margin:0 auto}
.sec{font-size:12.5px;color:#6b7a99;font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.par{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid #e3e8f2;border-radius:14px;padding:10px 12px;text-align:right}
.par .up{font-size:18px;color:#2b59c3}.par b{display:block;font-size:15px}.par small{color:#8a97b3;font-size:12px}
.me{background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 6px 24px rgba(43,89,195,.12);border:2px solid #2b59c3;margin-top:10px;animation:pop .25s ease}
.me.f{border-color:#d6336c;box-shadow:0 6px 24px rgba(214,51,108,.12)}.me.dead{border-color:#9aa7bd;background:#f6f7fa}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.me h2{margin:0;font-size:24px}.me .ns{color:#6b7a99;font-size:13px;margin-top:2px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{background:#eef2fa;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#3b4a6b}.tag.sp{background:#fdeef3;color:#c2255c}.tag.du{background:#eceff4;color:#6b7a99}
.acts{display:flex;gap:6px;margin-top:14px}.acts button{flex:1;border:1px solid #d5ddec;background:#fff;border-radius:12px;padding:9px 4px;font-size:12.5px;color:#2b3a5a}
.sibs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.sibs::-webkit-scrollbar{display:none}
.sib{flex:none;scroll-snap-align:center;background:#fff;border:1px solid #e3e8f2;border-radius:12px;padding:8px 12px;font-size:14px;min-width:78px;text-align:center}
.sib.cur{background:#2b59c3;color:#fff;border-color:#2b59c3}.sib small{display:block;font-size:10.5px;opacity:.7}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kid{background:#fff;border:1px solid #e3e8f2;border-radius:14px;padding:12px 10px;text-align:right;display:flex;flex-direction:column;gap:3px;min-height:72px}
.kid b{font-size:15.5px}.kid small{color:#8a97b3;font-size:11.5px}.kid .cnt{margin-top:auto;font-size:11.5px;color:#2b59c3;font-weight:600}.kid.f b{color:#a61e4d}.kid.dead{background:#f6f7fa}
.mg{grid-column:1/-1;font-size:12px;color:#c2255c;margin:6px 2px 0}
.empty{background:#fff;border:1px dashed #d5ddec;border-radius:14px;padding:14px;text-align:center;color:#8a97b3;font-size:13px}
.via{display:block;width:100%;background:#fff7fa;border:1px dashed #d6336c;color:#c2255c;border-radius:12px;padding:10px;font-size:13px}
.bot{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid #e3e8f2;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bot button{border:0;background:none;font-size:11px;color:#6b7a99;display:flex;flex-direction:column;align-items:center;gap:2px}.bot button i{font-style:normal;font-size:20px}
.note{background:#fff4d6;color:#7a5a12;font-size:12.5px;border-radius:12px;padding:10px 12px;line-height:1.7}
#msg{text-align:center;color:#8a97b3;padding:40px}
</style></head><body>
<div class="top"><h1>🌳 <span id="ttl">شجرة العائلة</span> <small>معاينة فقط</small></h1>
<div class="srch"><input id="q" placeholder="ابحث عن اسم…" autocomplete="off"><div id="res"></div></div>
<div class="crumbs" id="crumbs"></div></div>
<main id="main"><div id="msg">جارٍ تحميل الشجرة…</div></main>
<nav class="bot"><button id="nRoot"><i>🏠</i>الجدّ</button><button id="nMe"><i>🙋</i>أنا</button><button id="nBack"><i>↩</i>رجوع</button><button id="nTree"><i>🌳</i>الشجرة الكاملة</button></nav>
<script>
/* ===== FAM: gender, spouse links & nasab — shared block, keep identical in index.html and edit.html ===== */
const FAM=(()=>{
  const nm=s=>String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/يي$/,'ي').replace(/\s+/g,' ').trim();
  const F_NAMES='فاطمة عائشة حواء مريم زينب سارة هاجر سلمى إلهام آسيا نعيمة رحيمة رقية حفصة زبيدة مسعودة فوزية سندس ليان غفران لويزة بتول رميساء إكرام هبة كوثر فريال رتاج حسناء ضحى سهام سميرة فتيحة يمينة صبرينة كريمة لالة مامة هدى خولة نور أمينة خديجة صفية جميلة نادية سعاد وردة حليمة زهرة زهور نوال ليلى سمية أسماء آمنة شيماء إيمان أمال آمال حياة حنان دنيا ياسمين منى ملاك مروة نسرين وفاء صليحة باية حاية زيلوخة عيشة تونس جوهرة دليلة سهيلة جنات إسراء آية بشرى رانيا لينة لينا جنى تسنيم رحمة فرح نجاة ربيعة حورية جويدة ونيسة مباركة عتيقة يامنة خيرة سكينة بهية';
  const M_EXC='حمزة أسامة طلحة عبيدة حذيفة عكرمة معاوية عروة قتادة عطية بوعلامة زكرياء زكريا علاء بهاء ضياء الأولياء';
  const FS=new Set(F_NAMES.split(' ').map(nm)),MS=new Set(M_EXC.split(' ').map(nm));
  function guess(name){const raw=String(name||'').trim().split(/\s+/),w=raw.map(nm),all=nm(name),last=w[w.length-1]||'',first=w[0]||'',rl=raw[raw.length-1]||'';
    if(/الدين|عبد/.test(all))return 'm';
    if(MS.has(last))return 'm';
    if(FS.has(all)||FS.has(last)||FS.has(first))return 'f';
    if(/ة$/.test(rl)||/اء$/.test(rl))return 'f';
    return 'm';}
  function ctx(root){const by={},par={};(function w(n,p){by[n.id]=n;par[n.id]=p;n.children.forEach(c=>w(c,n));})(root,null);
    return {by,par,parent:n=>par[n.id]||null,spouse:n=>(n.spouseId&&by[n.spouseId]&&by[n.spouseId]!==n)?by[n.spouseId]:null};}
  const bn=n=>n&&n.female?'بنت':'بن';
  const ibn=n=>n&&n.female?'ابنة':'ابن';
  const spLabel=n=>n&&n.female?'الزوج':'الزوجة';
  const dua=n=>n.female?'رحمها الله':'رحمه الله';
  const spDua=n=>n.female?'رحمه الله':'رحمها الله';
  const spName1=(C,n)=>{const s=C.spouse(n);return s?(s.name||''):(n.spouse||'');};
  /* all spouses: the first (spouse/spouseId) + extra ones in n.wives[] */
  const spouses=(C,n)=>{const out=[];const a=spName1(C,n);if(a||(n.wives||[]).length)out.push({i:0,name:a||'—',dead:!!(n.spouseDead||n.spouseDeath),birth:n.spouseBirth||'',death:n.spouseDeath||'',link:C.spouse(n)});
    (n.wives||[]).forEach((w,k)=>{if(w&&w.name)out.push({i:k+1,name:w.name,dead:!!(w.dead||w.death),birth:w.birth||'',death:w.death||'',link:null});});return out;};
  const spName=(C,n)=>spouses(C,n).map(x=>x.name).filter(x=>x&&x!=='—').join(' · ');
  /* the mother of a child whose father has several wives (null when unknown / single wife) */
  const momOf=(C,c)=>{const p=C.parent(c);if(!p||p.female||!(p.wives||[]).length)return null;const L=spouses(C,p);return L.find(x=>x.i===(c.mom||0))||null;};
  /* nasab after the name, e.g. "بن بكير بن الناصر" — through a mother: "بن زوجها، وأمه فلانة بنت فلان" */
  function nasab(C,n,max,_d){max=max||99;_d=_d||0;const p=C.parent(n);if(!p||_d>=max)return '';
    if(!p.female){const rest=nasab(C,p,max,_d+1);return bn(n)+' '+(p.name||'—')+(rest?' '+rest:'');}
    const h=C.spouse(p),hn=h?h.name:(p.spouse||'');
    const mom=(n.female?'وأمها ':'وأمه ')+(p.name||'—'),mrest=nasab(C,p,Math.min(max,_d+3),_d+1);
    if(h){const hr=nasab(C,h,max,_d+1);return bn(n)+' '+hn+(hr?' '+hr:'')+'، '+mom+(mrest?' '+mrest:'');}
    return (hn?bn(n)+' '+hn+'، ':'')+mom+(mrest?' '+mrest:'');}
  /* children to show for n: own, or (if none) those recorded under the linked spouse */
  function viaSpouse(C,n){if(n.children.length)return null;const s=C.spouse(n);return s&&s.children.length?s:null;}
  return {nm,guess,ctx,bn,ibn,spLabel,dua,spDua,spName,spouses,momOf,nasab,viaSpouse};
})();
/* ===== end FAM ===== */

const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseDate(s){s=String(s||'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);let m;
  if((m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})/)))return{y:+m[3],m:+m[2],d:+m[1]};
  if((m=s.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/)))return{y:+m[1],m:+m[2],d:+m[3]};
  if((m=s.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})/)))return{y:+m[1],m:+m[2],d:0};
  if((m=s.match(/(\d{4})/)))return{y:+m[1],m:0,d:0};return null;}
function calcAge(bs,ds,dd){const b=parseDate(bs);if(!b)return null;
  const dead=!!(dd||ds);let e;
  if(dead){e=parseDate(ds);if(!e)return{age:null,dead:true};}
  else{const t=new Date();e={y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()};}
  let a=e.y-b.y;if(b.m&&e.m&&(e.m<b.m||(e.m===b.m&&b.d&&e.d&&e.d<b.d)))a--;
  return a>=0&&a<125?{age:a,dead}:null;}
function curYear(){const d=new Date();return d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;}
function studyInfo(n){if(n.dead||n.death)return null;if(!n.es)return{kind:'unknown'};
  if(n.es!=='study')return{kind:n.es};
  const L=(data.lab&&data.lab[n.ec])||[],j=(n.ei||0)+(curYear()-(n.ey||curYear()));
  return j>=0&&j<L.length?{kind:'study',label:L[j]+(n.em?' — '+n.em:''),uni:n.eu||''}:{kind:'done'};}
let data=null,C=null,cur=null,hist=[];
const SB={url:'https://xwurszjkydfylisvjzwz.supabase.co',key:'sb_publishable_bJ3-yY89bYk2VKcRYUY0_A_c4R8flsX'};
function norm(d){(function w(n){n.children=n.children||[];n.children.forEach(w);})(d.root);return d;}
async function load(){
  try{const q=await fetch(SB.url+'/rest/v1/tree_public?id=eq.1&select=data',{headers:{apikey:SB.key},cache:'no-store'});const j=await q.json();if(j&&j[0]&&j[0].data&&j[0].data.root)return norm(j[0].data);}catch(e){}
  const r=await fetch('tree.json?'+Date.now());return norm(await r.json());}
const age=n=>{const r=calcAge(n.birth,n.death,n.dead);return r&&r.age!=null?r.age:null;};
function kidsOf(n){if(n.children.length)return{list:n.children,via:null};const v=FAM.viaSpouse(C,n);return v?{list:v.children,via:v}:{list:[],via:null};}
function go(id,push){const n=C.by[id];if(!n)return;if(push!==false&&cur&&cur!==n)hist.push(cur.id);cur=n;render();window.scrollTo({top:0,behavior:'smooth'});try{history.replaceState(null,'','?p='+id);}catch(e){}}
function render(){const n=cur,p=C.parent(n),dead=!!(n.dead||n.death);
  const anc=[];{let a=p;while(a){anc.unshift(a);a=C.parent(a);}}
  $('#crumbs').innerHTML=anc.map(a=>`<button data-go="${a.id}">${esc(a.name)}</button><span>‹</span>`).join('')+`<button style="background:#2b59c3;color:#fff">${esc(n.name)}</button>`;
  setTimeout(()=>{const c=$('#crumbs');c.scrollLeft=-c.scrollWidth;},0);
  const tags=[];const a=age(n),b=parseDate(n.birth),d=parseDate(n.death);
  if(dead)tags.push(`<span class="tag du">🤲 ${FAM.dua(n)}${b||d?' · '+(b?b.y:'؟')+' – '+(d?d.y:'؟'):''}${a!=null?' · '+a+' سنة':''}</span>`);
  else if(a!=null)tags.push(`<span class="tag">🎂 ${a} سنة${b?' · '+b.y:''}</span>`);
  FAM.spouses(C,n).forEach(x=>tags.push(`<span class="tag sp" ${x.link?`data-go="${x.link.id}"`:''}>💍 ${esc(x.name)}${x.dead?' ('+FAM.spDua(n)+')':''}${x.link?' ←':''}</span>`));
  const si=studyInfo(n);if(si&&si.kind==='study')tags.push(`<span class="tag">📚 ${esc(si.label)}</span>`);else if(si&&si.kind==='working')tags.push('<span class="tag">💼 يعمل</span>');else if(si&&si.kind==='done')tags.push('<span class="tag">🎓 أنهى دراسته</span>');
  const sibs=p?p.children:[n];
  const K=kidsOf(n);let kidsHtml='';
  if(K.list.length){const card=k=>{const kk=kidsOf(k).list.length,ag=age(k);return `<button class="kid${k.female?' f':''}${k.dead||k.death?' dead':''}" data-go="${k.id}"><b>${esc(k.name)}</b><small>${k.dead||k.death?FAM.dua(k):ag!=null?ag+' سنة':''}</small>${kk?`<span class="cnt">👥 ${kk} ${kk===1?'ابن':'أبناء'} ←</span>`:''}</button>`;};
    const L=FAM.spouses(C,n);
    if(!K.via&&!n.female&&L.length>1)kidsHtml=L.map(x=>{const g=n.children.filter(c=>(c.mom||0)===x.i);return g.length?`<div class="mg">من ${esc(x.name)}</div>`+g.map(card).join(''):'';}).join('');
    else kidsHtml=K.list.map(card).join('');}
  $('#main').innerHTML=
   (p?`<div class="sec"><span>${p.female?'الأم':'الأب'}</span></div><button class="par" data-go="${p.id}"><span class="up">↑</span><div><b>${esc(p.name)}</b><small>${esc(FAM.nasab(C,p,2))}</small></div></button>`:'')+
   `<div class="me${n.female?' f':''}${dead?' dead':''}"><h2>${esc(n.name)}</h2>${p?`<div class="ns">${esc(FAM.nasab(C,n,4))}</div>`:''}<div class="tags">${tags.join('')}</div>
     <div class="acts"><button>🧬 ما صلتي به؟</button><button>🔗 رابط</button><button>✍ إكمال</button></div></div>`+
   (sibs.length>1?`<div class="sec"><span>الإخوة والأخوات</span><span>${sibs.length}</span></div><div class="sibs">${sibs.map(s=>`<button class="sib${s===n?' cur':''}" data-go="${s.id}">${esc(s.name)}${s.children.length?`<small>👥 ${s.children.length}</small>`:''}</button>`).join('')}</div>`:'')+
   `<div class="sec"><span>الأبناء</span><span>${K.list.length||''}</span></div>`+
   (K.via?`<button class="via" data-go="${K.via.id}">الأبناء مسجّلون عند ${n.female?'زوجها':'زوجته'} ${esc(K.via.name)} ←</button><div style="height:8px"></div>`:'')+
   (K.list.length?`<div class="kids">${kidsHtml}</div>`:'<div class="empty">لا يوجد أبناء مسجّلون</div>')+
   `<div class="sec"></div><div class="note">هذه <b>معاينة</b> لطريقة عرض مخصّصة للهاتف: شخص واحد في الوسط، أبوه فوقه، وإخوته بجانبه، وأبناؤه تحته. اضغط أي اسم للانتقال إليه.</div>`;
  setTimeout(()=>{const c=document.querySelector('.sib.cur');if(c)c.scrollIntoView({inline:'center',block:'nearest'});},0);}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){$('#res').style.display='none';go(g.dataset.go);}});
$('#nRoot').onclick=()=>go(data.root.id);
$('#nBack').onclick=()=>{const id=hist.pop();if(id)go(id,false);};
$('#nMe').onclick=()=>{let id=null;try{id=localStorage.getItem('famMe');}catch(e){}if(id&&C.by[id])go(id);else{$('#q').focus();$('#q').placeholder='اكتب اسمك…';}};
$('#nTree').onclick=()=>{location.href='index.html'+(cur?'?p='+cur.id:'');};
$('#q').addEventListener('input',e=>{const w=FAM.nm(e.target.value).split(' ').filter(x=>x&&!['بن','بنت'].includes(x)),R=$('#res');if(!w.length){R.style.display='none';return;}
  const hits=Object.values(C.by).filter(n=>w.every(x=>FAM.nm(n.name+' '+FAM.nasab(C,n)).includes(x))).slice(0,15);
  R.innerHTML=hits.length?hits.map(n=>`<div data-go="${n.id}"><b>${esc(n.name)}</b><small>${esc(FAM.nasab(C,n,3))}</small></div>`).join(''):'<div style="color:#8a97b3">لا نتائج</div>';R.style.display='block';});
load().then(d=>{data=d;C=FAM.ctx(d.root);$('#ttl').textContent=d.title||'شجرة العائلة';document.title='معاينة: '+(d.title||'');
  let id=null;try{id=new URLSearchParams(location.search).get('p');}catch(e){}go(id&&C.by[id]?id:d.root.id,false);}).catch(()=>{$('#msg').textContent='تعذّر تحميل الشجرة.';});
</script></body></html>
